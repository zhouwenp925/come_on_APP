name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_FILE: release-signing.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate signing and version
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Configure the four signing secrets using the original release key.'; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS" && test -n "$SIGNING_KEY_PASSWORD"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release-signing.jks
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$VERSION"; fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:lintRelease :app:assembleRelease --stacktrace
      - name: Package verified APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/shouxin-$APP_VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "收心 $APP_VERSION" --notes-file CHANGELOG.md
      - name: Remove runner signing file
        if: always()
        run: rm -f release-signing.jks
